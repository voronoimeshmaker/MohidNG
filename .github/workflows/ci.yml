name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libyaml-cpp-dev
      - name: Configure C++ Debug
        run: cmake --preset debug
      - name: Build C++ Debug
        run: cmake --build --preset debug
      - name: Test C++ Debug
        run: ctest --test-dir build/debug --output-on-failure
      - name: Validate documentation design system
        run: python tools/check_design_system.py
      - name: Validate trilingual documentation entry points
        run: python tools/check_trilingual_docs.py
      - name: Validate C++ include style
        run: python tools/check_include_style.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-docs.txt
      - name: Build Sphinx documentation
        run: sphinx-build -b html docs docs/html -W --keep-going
