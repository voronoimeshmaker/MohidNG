case:
  name: rectangular_domain_gradient
  description: Block 2 example driven by a YAML-formatted input file.

domain:
  type: rectangle
  length_x: 2.0
  length_y: 1.0

mesh:
  cells_x: 5
  cells_y: 4

field:
  name: phi
  location: Cell
  linear:
    coefficient_x: 2.0
    coefficient_y: -3.0
    constant: 5.0

numerics:
  gradient:
    method: weighted_least_squares_normal_equations
    weighting: inverse_distance_squared
